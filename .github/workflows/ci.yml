name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Throwaway database for test_migrations.py, which checks that the Alembic revisions
    # build exactly what schema.py declares.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formation
          POSTGRES_PASSWORD: formation
          POSTGRES_DB: formation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORMATION_TEST_DATABASE_URL: postgresql+psycopg2://formation:formation@localhost:5432/formation_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --all-packages

      - run: uv run ruff check .

      - run: uv run pytest packages/data/tests
